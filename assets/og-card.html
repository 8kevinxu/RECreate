<!doctype html>
<!--
  Source for assets/og.png — the 1200x630 Open Graph card used as og:image on
  every generated page (scripts/postbuild-web.js copies it to dist/og.png).

  Open Graph wants 1.91:1; the 1024x1024 app icon that used to fill this slot
  got center-cropped by every share surface. Keep the type large: previews are
  rendered around 500px wide, so anything under ~28px here is unreadable there.

  Regenerate after editing (no project dependency — uses your installed Chrome
  and a throwaway pngquant; Chrome's raw PNG is ~470KB, quantized ~130KB with no
  visible banding on this gradient):

    npx playwright@latest install chromium
    npx playwright@latest screenshot --viewport-size=1200,630 \
      assets/og-card.html /tmp/og-raw.png
    npx --yes pngquant-bin --quality=70-92 --strip --force \
      --output assets/og.png /tmp/og-raw.png

  Colors track the app icon's blue gradient and the landing pages' orange CTA.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #5b9df5 0%, #3d7ade 45%, #2559c0 100%);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
    overflow: hidden;
    position: relative;
  }
  /* Faint street grid, echoing the map in the app icon. */
  .grid {
    position: absolute; inset: -20% -10%;
    background-image:
      linear-gradient(rgba(255,255,255,.10) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,.10) 2px, transparent 2px);
    background-size: 88px 88px;
    transform: rotate(-14deg);
  }
  .text { position: relative; flex: 1; }
  h1 {
    font-size: 104px; font-weight: 800; letter-spacing: -3px; line-height: 1;
    text-shadow: 0 3px 18px rgba(0,0,0,.22);
  }
  .tag {
    font-size: 41px; font-weight: 600; line-height: 1.25; margin-top: 20px;
    color: rgba(255,255,255,.96); text-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  .sports { font-size: 44px; margin-top: 26px; letter-spacing: 6px; }
  /* Stacked, not a row: "San Francisco · New York City" plus the pill overflows
     the text column and breaks mid-phrase ("… · New / York City"). */
  .foot { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; margin-top: 34px; }
  .cities { font-size: 29px; font-weight: 600; color: rgba(255,255,255,.9); white-space: nowrap; }
  .url {
    font-size: 27px; font-weight: 800; color: #fff;
    background: #ff7a1a; padding: 10px 22px; border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,.22);
  }
  .art { position: relative; width: 392px; height: 392px; flex: none; }
  .art img {
    width: 100%; height: 100%; border-radius: 76px; display: block;
    box-shadow: 0 22px 60px rgba(10,30,70,.42);
  }
</style>
</head>
<body>
<div class="grid"></div>
<div class="text">
  <h1>RECreate</h1>
  <p class="tag">Find somewhere to play<br>right now</p>
  <div class="sports">🏀 🎾 🏐 🏓 ⚽ 🏊 ⛳</div>
  <div class="foot">
    <span class="cities">San Francisco · New York City</span>
    <span class="url">playrecreate.com</span>
  </div>
</div>
<div class="art"><img src="./icon.png" alt=""></div>
</body>
</html>
