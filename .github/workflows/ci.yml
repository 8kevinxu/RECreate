name: CI

# Thin sanity gate (scripts/check-app.js), not a test suite: every .js parses,
# lib/i18n.js keeps en/zh/es at full key parity, and the generated data modules
# load with non-trivial entry counts. Runs on the data-refresh crons' commits
# too, so a scrape that slips past its own build gates still turns main red.

on:
  push:
    branches: [main]
    # The NYC feeder pushes a liveness heartbeat on its own commit twice a day
    # (see watch-nyc-feeder.yml). It is metadata about a job, cannot affect
    # anything this gate checks, and arrives as a push containing nothing else —
    # so running the full sweep on it is pure noise. Any push that also touches
    # real files still runs.
    paths-ignore:
      - scripts/nyc-feeder-status.json
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check
