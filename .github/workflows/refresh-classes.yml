name: Refresh class availability

# Class openings change far faster than court schedules (people enroll daily), so
# the ActiveNet class catalog is re-scraped on its own frequent cadence — separate
# from the weekly full data refresh — committing only the classes data when it
# changes. build:classes self-gates (keeps last-good on a bad/short scrape).
#
# SF and NYC scrape in separate steps guarded by `!cancelled()`. NYC's build calls
# `reportStale()`, which exits non-zero on a stale cache fallback while still
# shipping usable data; without the guard that exit code skipped the commit step
# and threw away SF's perfectly good scrape along with it.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # scrapes are ~1-2 min; hard-cap so a hung fetch can't burn the runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Guard for every step below: a failed install means there is nothing to
      # run, but a failed *scrape* must not skip the rest.
      - run: npm ci
        id: deps

      - name: Re-scrape class availability
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build:classes
        env:
          # Optional: pre-translates any *new* class titles to zh/es (Claude Haiku).
          # Absent → build still succeeds, titles stay English. Cache keeps cost ~0.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Volunteer workparties carry a live "still needed" count and a rolling set
      # of shift dates, so they go stale exactly like enrollments. Self-gates.
      - name: Re-scrape SF volunteer opportunities
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build:volunteer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # NYC's feed is a rolling ~14-day events window, so it goes stale on the
      # same cadence as ActiveNet enrollments. Self-gates like build:classes.
      - name: Re-scrape NYC Parks programs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build:nyc-classes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Runs even when a scrape above failed, so a stale NYC source can't discard
      # SF's fresh catalog. The job still reports failure. Committing the i18n
      # caches here also stops a failed run from re-translating the same titles
      # through Haiku every 6 hours.
      - name: Commit refreshed classes if they changed
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          # i18n cache only exists once a key-enabled run has translated something,
          # so stage just the files that are present; staging catches new files too.
          for f in data/classes.js data/volunteer.js scripts/sf-volunteer-cache.json scripts/sf-volunteer-i18n-cache.json scripts/classes-cache.json scripts/classes-pass2-cache.json scripts/classes-i18n-cache.json data/cities/nyc/classes.js scripts/cities/nyc-classes-cache.json scripts/cities/nyc-classes-cost-cache.json scripts/cities/nyc-classes-desc-cache.json scripts/cities/nyc-classes-i18n-cache.json; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No class changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh class availability"
            # Another refresh job may have pushed while this one scraped.
            # refresh-classes (0 */6) and refresh-reservations (0 */3) fire on
            # the same minute every 6h, and the local NYC feeder pushes twice a
            # day, so without this the loser of a race throws away a scrape it
            # had already finished — the run goes red with the data on the floor.
            # These jobs do NOT all stage disjoint files, which this comment
            # used to claim: refresh-classes, refresh-schedules and the local
            # NYC feeder all regenerate data/cities/nyc/classes.js and the
            # scripts/cities caches. Two independent regenerations of one
            # generated file differ in content by definition, so a conflict here
            # is routine, and a plain rebase fails on it — red run, finished
            # scrape on the floor, which is the exact outcome the retry exists
            # to prevent (it wedged the feeder for five runs on 2026-09-15).
            # -X ours resolves conflicts in favour of whatever is already on
            # origin. In a rebase our commits replay ON TOP of upstream, so
            # "ours" is origin's side. That is the right winner for these paths:
            # nycgovparks.org 405s GitHub's runners, so this job's NYC output is
            # a cache fallback, while whoever pushed ahead of us (the feeder,
            # scraping from an unblocked egress) has the live data. Files nobody
            # else writes never conflict, so this job's own scrape still lands.
            pushed=""
            for attempt in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/main"
              git pull --rebase -X ours origin main || { echo "rebase failed"; exit 1; }
            done
            [ -n "$pushed" ] || { echo "push still rejected after 3 attempts"; exit 1; }
          fi
